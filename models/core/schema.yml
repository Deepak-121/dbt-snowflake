version: 2

models:
  - name: dim_patient
    description: "Core patient dimension"

    columns:
      - name: patient_id
        description: "Unique patient identifier"
        data_tests:
          - not_null
          - unique
          
  - name: fact_appointment
    description: "Core appointment fact"

    columns:
      - name: appointment_id
        description: "Unique appointment identifier"
        data_tests:
          - not_null
          - unique

      - name: patient_id
        description: "Patient associated with the appointment"
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_patient')
              field: patient_id