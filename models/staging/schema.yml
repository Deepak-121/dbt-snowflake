
version: 2

models:
  - name: stg_patient
    description: "Staging layer for patient data"

    columns:
      - name: patient_id
        description: "Unique patient identifier"
        data_tests:
          - not_null
          - unique

      - name: first_name
        data_tests:
          - not_null

      - name: last_name
        data_tests:
          - not_null

      - name: gender
        data_tests:
          - not_null
