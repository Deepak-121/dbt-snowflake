
name: 'healthcare_dbt'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'healthcare_dbt'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

models:
  healthcare_dbt:
    +materialized: view
    staging:
      +schema: STG
      +materialized: view
    core:
      +schema: CORE
      +materialized: table
    curated:
      +schema: CURATED
      +materialized: view
